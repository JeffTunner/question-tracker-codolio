services:
  - type: web
    name: codolio-backend
    env: java
    plan: free
    region: oregon
    buildCommand: ./gradlew build -x test
    startCommand: java -jar backend/build/libs/*.jar
    autoDeploy: true
    healthCheckPath: /actuator/health
    # If you need any environment variables (e.g., CORS_ORIGIN) add them here
    envVars:
      - key: CORS_ORIGIN
        value: "*" # Adjust to your Vercel domain after Vercel deployment
